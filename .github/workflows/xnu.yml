name: xnu

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"


concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  # ccache: xnu is ~2000 compiles; a patch usually changes a few of them
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the marble kernel is plain arm64.
          # marble: A510/A710/X2 (ARMv9) -> build at ARMv8.2 with LSE via cortex-a55.
          # (cortex-a53 would disable LSE; a78/a710 can be tried later once it boots.)
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a55"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a55"' dxb/build.sh
          # xnu's makedefs take CC/CXX from the environment dxb exports; xcodebuild
          # (mig, ctf tools) needs a single executable, so point at wrappers
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
          mkdir -p "$CCACHE_WRAP"
          for t in clang clang++; do
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(xcrun -find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done
          cat "$CCACHE_WRAP/clang"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ hashFiles('xnu/patches/**', '.github/workflows/xnu.yml') }}
          restore-keys: |
            ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          ccache -z
          set -o pipefail
          # tee so a failed build still leaves the compiler diagnostics behind
          bash build.sh 2>&1 | tee /tmp/build.log
          ccache -s

      # dxb applies patches with a warning-and-continue policy, so a patch
      # that no longer applies still produces a green build with the change
      # silently missing.  Failing here costs one CI run; not failing it
      # ships a kernel that silently lacks the change being tested.
      - name: Verify our patches applied
        run: |
          # dxb copies xnu/patches into dxb/patches and applies from there,
          # so the skip line names the COPY, not xnu/patches.  Match by
          # basename against our series instead.  0172 is an obsolete
          # experiment superseded by the later glink patches and is allowed
          # to skip.
          skipped=$(grep -oE 'Skipping patch [^ ]+' /tmp/build.log \
            | sed 's|.*/||' || true)
          bad=""
          for b in $skipped; do
            if [ -f "xnu/patches/$b" ] && [ "$b" != "0172-sweet-shm-plain-physical.patch" ]; then
              bad="$bad $b"
            fi
          done
          if [ -n "$bad" ]; then
            echo "skipped:$bad"
            echo "::error::a repository patch was skipped"
            exit 1
          fi
          echo "all patch-series entries applied"

          # A patch can also "apply" while a later edit reverts it.  Check
          # the built kernel for one marker per recent patch that must be
          # linked in.
          K="dxb/fakeroot/System/Library/Kernels/kernel.development.sweet"
          for s in "SWEET: PON shutdown" \
                   "SWEET: skip PM halt/restart notifications" \
                   "SWEET: halt fallback after 5 s" \
                   "SWEET BATT: tick ok="; do
            if ! LC_ALL=C grep -aq "$s" "$K"; then
              echo "::error::missing kernel marker: $s (patch skipped?)"
              exit 1
            fi
          done
          echo "expected markers present"

      # The job log needs admin rights to download, so publish the actual
      # compiler diagnostics as a release asset instead - that is readable.
      - name: Publish build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "commit: ${{ github.sha }}"
            echo
            echo "=== errors ==="
            grep -nE 'error:|fatal error|undefined|undeclared|expected' /tmp/build.log \
              | grep -viE 'unifdef|--- ERROR ---' | head -80 || true
            echo
            echo "=== tail ==="
            tail -60 /tmp/build.log || true
          } > build-error.txt
          wc -l build-error.txt
          gh release upload kernel-latest build-error.txt --clobber \
            --repo "${{ github.repository }}" \
            || gh release create kernel-latest build-error.txt \
                 --title "kernel" --notes "build diagnostics" \
                 --repo "${{ github.repository }}" || true

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

      # Public, unauthenticated download path for the RAM-only test workflow.
      # The artifact is only the kernel binary; the repo and patches are public.
      - name: Publish kernel to rolling release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f out/kernel.development.sweet ]; then
            echo "no kernel was built; nothing to publish"
            exit 0
          fi
          gh release view kernel-latest >/dev/null 2>&1 || \
            gh release create kernel-latest --prerelease \
              --title "kernel-latest" \
              --notes "Rolling XNU build for marble (RAM-only fastboot tests)"
          gh release upload kernel-latest out/kernel.development.sweet --clobber
          shasum -a 256 out/kernel.development.sweet
